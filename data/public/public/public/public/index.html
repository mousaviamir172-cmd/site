<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>امور مالی پترو صنعت جنوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/landing.css" />
</head>
<body>

  <div class="scene">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
    <div class="grain"></div>

    <main class="hero">
      <img src="/assets/logo.png" alt="پترو صنعت جنوب" class="gate-logo" />

      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        درگاه داخلی با دسترسی کنترل‌شده
      </div>

      <h1>امور مالی پترو صنعت جنوب</h1>
      <p class="lede">دسترسی متمرکز، امن و روشن به اطلاعات مالی مجموعه</p>

      <div class="gate-cards">
        <a class="gate-card" href="/login.html?role=viewer">
          <span class="gate-icon icon-view">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
          </span>
          <span class="gate-title">مشاهده</span>
          <span class="gate-desc">مرور و بررسی گزارش‌های مالی</span>
          <span class="gate-link">ورود به بخش مشاهده <span class="chev">‹</span></span>
        </a>

        <a class="gate-card" href="/login.html?role=editor">
          <span class="gate-icon icon-edit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 20l1.1-4L16.5 4.6a1.5 1.5 0 0 1 2.1 0l.8.8a1.5 1.5 0 0 1 0 2.1L8 18l-4 2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </span>
          <span class="gate-title">ویرایش</span>
          <span class="gate-desc">ثبت و به‌روزرسانی گزارش‌های مالی</span>
          <span class="gate-link">ورود به بخش ویرایش <span class="chev">‹</span></span>
        </a>
      </div>

      <p class="foot-note">این نسخه‌ی نمایشی است — اطلاعات ثبت‌شده موقتی است.</p>
    </main>
  </div>

</body>
</html>
